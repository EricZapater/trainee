<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{.LogoURL}}" alt="Trainee Logo" style="max-width: 150px;">
        </div>
        
        <h2>Hola {{.Nom}},</h2>
        
        <p>Se ha recibido una nueva respuesta en el formulario <strong>"{{.FormTitol}}"</strong>.</p>
        
        <div style="background-color: #f9f9f9; border-left: 4px solid #6366f1; padding: 15px; margin: 20px 0;">
            <p><strong>Candidato / Usuario:</strong> {{.CandidatNom}}</p>
            <p><strong>Email:</strong> {{.CandidatEmail}}</p>
        </div>
        
        <p>Puedes revisar todas las respuestas desde el panel de gestión de formularios.</p>
        
        <p>Atentamente,<br>El equipo de Trainee</p>
    </div>
</body>
</html>

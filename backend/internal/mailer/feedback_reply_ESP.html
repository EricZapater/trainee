<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{.LogoURL}}" alt="Trainee Logo" style="max-width: 150px;">
        </div>
        
        <h2>Hola {{.Nom}},</h2>
        
        <p>Tu ticket <strong>"{{.Resum}}"</strong> ha sido actualizado.</p>
        
        <p><strong>Nuevo estado:</strong> {{.Estat}}</p>
        
        {{if .Resposta}}
        <div style="background-color: #f9f9f9; border-left: 4px solid #6366f1; padding: 15px; margin: 20px 0;">
            <p style="margin-top: 0;"><strong>Respuesta del equipo:</strong></p>
            <p style="margin-bottom: 0;">{{.Resposta}}</p>
        </div>
        {{end}}
        
        <p>Gracias por ayudarnos a mejorar Trainee.</p>
        
        <p>Atentamente,<br>El equipo de Trainee</p>
    </div>
</body>
</html>

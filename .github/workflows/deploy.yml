name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
      - pre
  workflow_dispatch:
    inputs:
      target:
        description: 'Entorn a desplegar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre
          - pro
          - all

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------
  # Avaluació de condicions d'execució (PRE vs PRO)
  # -----------------------------------------------------------------------
  check-targets:
    name: Check Deployment Target
    runs-on: ubuntu-latest
    outputs:
      deploy_pre: ${{ steps.flags.outputs.deploy_pre }}
      deploy_pro: ${{ steps.flags.outputs.deploy_pro }}
    steps:
      - name: Compute deployment flags
        id: flags
        run: |
          TARGET="${{ github.event.inputs.target || 'auto' }}"
          REF="${{ github.ref }}"
          
          DEPLOY_PRE=false
          DEPLOY_PRO=false
          
          if [ "$TARGET" = "pre" ]; then
            DEPLOY_PRE=true
          elif [ "$TARGET" = "pro" ]; then
            DEPLOY_PRO=true
          elif [ "$TARGET" = "all" ]; then
            DEPLOY_PRE=true
            DEPLOY_PRO=true
          elif [ "$REF" = "refs/heads/pre" ]; then
            DEPLOY_PRE=true
          elif [ "$REF" = "refs/heads/main" ]; then
            DEPLOY_PRO=true
          fi
          
          echo "deploy_pre=$DEPLOY_PRE" >> $GITHUB_OUTPUT
          echo "deploy_pro=$DEPLOY_PRO" >> $GITHUB_OUTPUT
          echo "Target=$TARGET, Ref=$REF => DEPLOY_PRE=$DEPLOY_PRE, DEPLOY_PRO=$DEPLOY_PRO"

  # =======================================================================
  # PIPELINE PRE (Model Yule amb PRE_SSH_HOST, PRE_SSH_USER, PRE_SSH_KEY)
  # =======================================================================
  build-and-push-pre:
    name: Build & Publish PRE Images (GHCR)
    needs: check-targets
    if: needs.check-targets.outputs.deploy_pre == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend PRE
      - name: Extract metadata for Backend PRE
        id: meta-backend-pre
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trainee-backend-pre
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Backend PRE image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend-pre.outputs.tags }}
          labels: ${{ steps.meta-backend-pre.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend PRE
      - name: Extract metadata for Frontend PRE
        id: meta-frontend-pre
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trainee-frontend-pre
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Frontend PRE image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-pre
          file: ./frontend-pre/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend-pre.outputs.tags }}
          labels: ${{ steps.meta-frontend-pre.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pre:
    name: Deploy Containers to Remote PRE VPS
    needs: [check-targets, build-and-push-pre]
    if: needs.check-targets.outputs.deploy_pre == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.pre.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRE_SSH_HOST }}
          username: ${{ secrets.PRE_SSH_USER }}
          key: ${{ secrets.PRE_SSH_KEY }}
          port: ${{ secrets.PRE_SSH_PORT || 22 }}
          source: "docker-compose.pre.yml"
          target: "/opt/apps/trainee"

      - name: Execute remote deployment commands via SSH (PRE)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRE_SSH_HOST }}
          username: ${{ secrets.PRE_SSH_USER }}
          key: ${{ secrets.PRE_SSH_KEY }}
          port: ${{ secrets.PRE_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p /opt/apps/trainee
            cd /opt/apps/trainee
            if [ -f docker-compose.pre.yml ]; then
              mv -f docker-compose.pre.yml docker-compose.yml
            fi
            [ -f .env.backend ] || touch .env.backend 2>/dev/null || true
            [ -f .env.frontend ] || touch .env.frontend 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans || (sleep 4 && docker compose up -d --remove-orphans)
            docker image prune -f || true
            docker compose ps

      # -----------------------------------------------------------------------
      # Registre a RawCraft Monitor (PRE)
      # -----------------------------------------------------------------------
      - name: 🚀 Registrar Desplegament a RawCraft Monitor (PRE)
        if: always()
        env:
          RAWCRAFT_API_KEY: ${{ secrets.RAWCRAFT_API_KEY }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          SERVICES=("trainee-pre-back" "trainee-pre-front")
          if [ -z "$RAWCRAFT_API_KEY" ]; then
            echo "⚠️ Advertència: El secret RAWCRAFT_API_KEY no està definit a GitHub Secrets. Ometent registre."
            exit 0
          fi

          COMMIT_MSG_JSON=$(echo "$HEAD_COMMIT_MSG" | jq -sR .)
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"

          for PRODUCT in "${SERVICES[@]}"; do
            echo "🚀 Registrant desplegament a RawCraft Monitor per a: $PRODUCT (Estat: $STATUS)..."
            curl -fsSL -X POST https://api.monitor.ericzapater.cat/api/v1/deploys \
              -H "Content-Type: application/json" \
              -H "X-Agent-Key: $RAWCRAFT_API_KEY" \
              -d '{
                "product_name": "'"$PRODUCT"'",
                "environment": "production",
                "version": "${{ github.ref_name }}",
                "commit_sha": "${{ github.sha }}",
                "commit_message": '"$COMMIT_MSG_JSON"',
                "branch": "${{ github.ref_name }}",
                "deployed_by": "${{ github.actor }}",
                "status": "'"$STATUS"'"
              }'
            echo ""
          done

  # =======================================================================
  # PIPELINE PRO (Entorn de Producció existent)
  # =======================================================================
  build-and-push-pro:
    name: Build & Publish PRO Images (GHCR)
    needs: check-targets
    if: needs.check-targets.outputs.deploy_pro == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend PRO
      - name: Extract metadata for Backend PRO
        id: meta-backend-pro
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trainee-backend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Backend PRO image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend-pro.outputs.tags }}
          labels: ${{ steps.meta-backend-pro.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend PRO
      - name: Extract metadata for Frontend PRO
        id: meta-frontend-pro
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trainee-frontend
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push Frontend PRO image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend-pro.outputs.tags }}
          labels: ${{ steps.meta-frontend-pro.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pro:
    name: Deploy Containers to Remote PRO VPS
    needs: [check-targets, build-and-push-pro]
    if: needs.check-targets.outputs.deploy_pro == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to PRO VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/trainee 2>/dev/null || cd ~/trainee
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "Pulling and starting services: trainee-backend trainee-frontend"
            docker compose pull trainee-backend trainee-frontend
            docker compose up -d --no-deps trainee-backend trainee-frontend
            docker image prune -af

      # -----------------------------------------------------------------------
      # Registre a RawCraft Monitor (PRO)
      # -----------------------------------------------------------------------
      - name: 🚀 Registrar Desplegament a RawCraft Monitor (PRO)
        if: always()
        env:
          RAWCRAFT_API_KEY: ${{ secrets.RAWCRAFT_API_KEY }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          SERVICES=("trainee-pro-back" "trainee-pro-front")
          if [ -z "$RAWCRAFT_API_KEY" ]; then
            echo "⚠️ Advertència: El secret RAWCRAFT_API_KEY no està definit a GitHub Secrets. Ometent registre."
            exit 0
          fi

          COMMIT_MSG_JSON=$(echo "$HEAD_COMMIT_MSG" | jq -sR .)
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"

          for PRODUCT in "${SERVICES[@]}"; do
            echo "🚀 Registrant desplegament a RawCraft Monitor per a: $PRODUCT (Estat: $STATUS)..."
            curl -fsSL -X POST https://api.monitor.ericzapater.cat/api/v1/deploys \
              -H "Content-Type: application/json" \
              -H "X-Agent-Key: $RAWCRAFT_API_KEY" \
              -d '{
                "product_name": "'"$PRODUCT"'",
                "environment": "production",
                "version": "${{ github.ref_name }}",
                "commit_sha": "${{ github.sha }}",
                "commit_message": '"$COMMIT_MSG_JSON"',
                "branch": "${{ github.ref_name }}",
                "deployed_by": "${{ github.actor }}",
                "status": "'"$STATUS"'"
              }'
            echo ""
          done

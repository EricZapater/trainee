name: Deploy Trainee to VPS

on:
  push:
    branches:
      - main
      - pre
  workflow_dispatch:
    inputs:
      target:
        description: 'Entorn a desplegar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre
          - pro
          - all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      build_pre: ${{ steps.flags.outputs.build_pre }}
      build_pro: ${{ steps.flags.outputs.build_pro }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute environment flags
        id: flags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$REPO_LOWER" >> $GITHUB_ENV
          
          TARGET="${{ github.event.inputs.target || 'auto' }}"
          REF="${{ github.ref }}"
          
          BUILD_PRE=false
          BUILD_PRO=false
          
          if [ "$TARGET" = "pre" ]; then
            BUILD_PRE=true
          elif [ "$TARGET" = "pro" ]; then
            BUILD_PRO=true
          elif [ "$TARGET" = "all" ]; then
            BUILD_PRE=true
            BUILD_PRO=true
          elif [ "$REF" = "refs/heads/pre" ]; then
            BUILD_PRE=true
          elif [ "$REF" = "refs/heads/main" ]; then
            BUILD_PRO=true
          fi
          
          echo "build_pre=$BUILD_PRE" >> $GITHUB_OUTPUT
          echo "build_pro=$BUILD_PRO" >> $GITHUB_OUTPUT
          echo "Target=$TARGET, Ref=$REF => BUILD_PRE=$BUILD_PRE, BUILD_PRO=$BUILD_PRO"

      # ============================================================
      # IMATGES PRO (Branques main / target pro / all)
      # ============================================================
      - name: Build and push Backend Docker image (PRO)
        if: steps.flags.outputs.build_pro == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

      - name: Build and push Frontend Docker image (PRO)
        if: steps.flags.outputs.build_pro == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

      # ============================================================
      # IMATGES PRE (Branques pre / target pre / all)
      # ============================================================
      - name: Build and push Backend Docker image (PRE)
        if: steps.flags.outputs.build_pre == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend-pre:latest

      - name: Build and push Frontend Docker image (PRE - React)
        if: steps.flags.outputs.build_pre == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-pre
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend-pre:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/trainee 2>/dev/null || cd ~/trainee
            
            # Fer login al Github Container Registry des del VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            SERVICES=""
            if [ "${{ needs.build-and-push-images.outputs.build_pro }}" = "true" ]; then
              SERVICES="$SERVICES trainee-backend trainee-frontend"
            fi
            if [ "${{ needs.build-and-push-images.outputs.build_pre }}" = "true" ]; then
              SERVICES="$SERVICES trainee-backend-pre trainee-frontend-pre"
            fi
            
            if [ -n "$SERVICES" ]; then
              echo "Pulling and starting services: $SERVICES"
              docker compose pull $SERVICES
              docker compose up -d --no-deps $SERVICES
              docker image prune -af
            fi

      # ============================================================
      # REGISTRE A RAWCRAFT MONITOR
      # ============================================================
      - name: 🚀 Registrar Desplegament a RawCraft Monitor
        if: always()
        env:
          RAWCRAFT_API_KEY: ${{ secrets.RAWCRAFT_API_KEY }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          SERVICES=()
          if [ "${{ needs.build-and-push-images.outputs.build_pre }}" = "true" ]; then
            SERVICES+=("trainee-pre-back" "trainee-pre-front")
          fi
          if [ "${{ needs.build-and-push-images.outputs.build_pro }}" = "true" ]; then
            SERVICES+=("trainee-pro-back" "trainee-pro-front")
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "Cap servei desplegat per registrar a RawCraft Monitor."
            exit 0
          fi

          if [ -z "$RAWCRAFT_API_KEY" ]; then
            echo "⚠️ Advertència: El secret RAWCRAFT_API_KEY no està definit a GitHub Secrets. Ometent registre."
            exit 0
          fi

          COMMIT_MSG_JSON=$(echo "$HEAD_COMMIT_MSG" | jq -sR .)
          STATUS="${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"

          for PRODUCT in "${SERVICES[@]}"; do
            echo "🚀 Registrant desplegament a RawCraft Monitor per a: $PRODUCT (Estat: $STATUS)..."
            curl -fsSL -X POST https://api.monitor.ericzapater.cat/api/v1/deploys \
              -H "Content-Type: application/json" \
              -H "X-Agent-Key: $RAWCRAFT_API_KEY" \
              -d '{
                "product_name": "'"$PRODUCT"'",
                "environment": "production",
                "version": "${{ github.ref_name }}",
                "commit_sha": "${{ github.sha }}",
                "commit_message": '"$COMMIT_MSG_JSON"',
                "branch": "${{ github.ref_name }}",
                "deployed_by": "${{ github.actor }}",
                "status": "'"$STATUS"'"
              }'
            echo ""
          done
